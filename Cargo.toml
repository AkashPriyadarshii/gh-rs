[package]
name = "gh-rs"
version = "0.1.0"
edition = "2021"
description = "Small GitHub CLI in Rust: keychain auth, repo/pr/issue commands, JSON output"
license = "MIT"
repository = "https://github.com/AkashPriyadarshii/gh-rs"
keywords = ["github", "cli", "git", "devtools", "command-line"]
categories = ["command-line-utilities"]
exclude = ["site/", ".github/"]

[profile.release]
strip = true
lto = true
codegen-units = 1
# panic = "abort" deliberately absent: backtraces on crash reports beat ~1MB
# savings for a CLI whose users file issues with stack traces.

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
keyring = "4.2.0"
octocrab = "0.54.2"
reqwest = { version = "0.13.5", features = ["form", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt", "time"] }
