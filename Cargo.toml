[package]
name = "gh-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
keyring = "4.2.0"
octocrab = "0.54.2"
reqwest = { version = "0.13.5", features = ["form", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt", "time"] }
